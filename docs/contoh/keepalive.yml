# CONTOH (tidak aktif). Salin ke .github/workflows/keepalive.yml di repositori Anda untuk mengaktifkan.
# Memanggil API publik Supabase seminggu dua kali agar proyek gratis tidak dianggap tidak aktif.
# Butuh dua "Repository variables/secrets": SUPABASE_URL dan SUPABASE_PUBLISHABLE_KEY (kunci publishable, BUKAN service_role).
name: keepalive
on:
  schedule:
    - cron: "17 3 * * 1,4"   # Senin & Kamis 03:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" > /dev/null
