[build]
  command = "npm run build"
  publish = "dist"

  # Vite versi ini membutuhkan Node.js modern; kunci versinya agar build tidak bergantung pada bawaan Netlify.
  [build.environment]
    NODE_VERSION = "22"
    # PENYEBAB UMUM BUILD GAGAL: pemindai rahasia Netlify menemukan nilai VITE_SUPABASE_URL / kunci publishable di hasil
    # build (memang sengaja publik di aplikasi browser) lalu menghentikan deploy. Kunci ini aman dipublikasikan
    # (dilindungi RLS), jadi dikecualikan dari pemindaian. JANGAN pernah memakai service_role di variabel VITE_.
    SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SITE_URL,VITE_GOOGLE_SITE_VERIFICATION"
    NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[functions]
  directory = "netlify/functions"

# Alamat bawaan Netlify dialihkan permanen ke domain resmi (agar Google tidak mengindeks dua alamat).
# Hanya berlaku untuk host ini; Deploy Preview / Branch Deploy memakai host lain sehingga tidak terpengaruh.
# PENTING: ubah dulu private.notify_config.url di Supabase ke domain resmi sebelum men-deploy aturan ini.
[[redirects]]
  from = "https://dema-stai-bu.netlify.app/*"
  to = "https://demastaibu.my.id/:splat"
  status = 301
  force = true

# robots.txt dan sitemap.xml dibuat dinamis oleh fungsi (HARUS di atas aturan SPA di bawah)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
  force = true

# Metadata per halaman untuk pratinjau tautan & Google (hanya detail berita/agenda). HAPUS dua aturan ini bila ingin menonaktifkannya.
[[redirects]]
  from = "/berita/*"
  to = "/.netlify/functions/meta?type=berita&slug=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/agenda/*"
  to = "/.netlify/functions/meta?type=agenda&slug=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/galeri/*"
  to = "/.netlify/functions/meta?type=galeri&slug=:splat"
  status = 200
  force = true

# Netlify Image CDN: mengecilkan gambar pratinjau tautan (og:image) dari Supabase Storage menjadi 1200x630.
[images]
  remote_images = ['https://[a-z0-9-]+\.supabase\.co/storage/v1/object/public/.*']

# Berkas /assets yang sudah tidak ada (sisa versi lama) harus 404, BUKAN index.html. Bila tidak, peramban menerima HTML
# dengan tipe text/html dan muncul galat "Failed to load module script".
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA: semua URL diarahkan ke index.html agar React Router bisa membuka halaman langsung
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html tidak boleh di-cache lama agar pengunjung selalu mendapat daftar berkas versi terbaru
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Berkas hasil build memiliki nama berisi hash -> aman di-cache lama (menghemat bandwidth)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    # MODE LAPOR SAJA: tidak memblokir apa pun. Setelah deploy, buka situs, cek Console peramban
    # (F12) pada semua halaman. Bila tidak ada pelanggaran "Content Security Policy", ganti nama header
    # ini menjadi "Content-Security-Policy" agar benar-benar diberlakukan. Lihat docs/04-KEAMANAN.md.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
